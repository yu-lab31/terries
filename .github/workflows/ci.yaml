name: Test && Build && Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Test Under Unix Env && Cross-Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gcc gcc-mingw-w64

      - name: 1. Navtive Build && Run Unit Tests
        run: |
          meson setup build
          meson test -C build -v

      - name: 2. Cross-Compile Windows DLL
        run: |
          meson setup windows_build --cross-file Crossfile -Dbuildtype=release
          meson compile -C windows_build

      - name: Extract Version Number
        id: get_version
        run: |
          VERSION=$(meson introspect windows_build --projectinfo | jq -r .version)
          echo "PROJ_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Project version: $VERSION"

      - name: Release Binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-dll
          path: windows_build/*.dll
